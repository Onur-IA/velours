<script>
// Hors ligne : le service worker garde le jeu en cache (version statique ou serveur local, jamais en démonstration).
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === '127.0.0.1' || location.hostname === 'localhost') && !/[?&]demo=1/.test(location.search) && !/[?&]sanssw=1/.test(location.search)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
